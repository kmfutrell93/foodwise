<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="references/NoriIcon.png" />
  <title>FoodWise – Generating Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <style type="text/tailwindcss">
    :root {
      --background: #141311; --foreground: #F4EFE6;
      --primary: #E89D35; --primary-foreground: #141311;
      --secondary: #8A9A7C; --muted: #2A2824; --muted-foreground: #9B968C;
      --accent: #D87F63; --card: #1E1D1A; --border: #2E2C28;
    }
    body { background: var(--background); color: var(--foreground); font-family: 'Plus Jakarta Sans', sans-serif; }

    @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse-glow { 0%,100% { opacity: 0.3; transform: scale(0.95); } 50% { opacity: 0.6; transform: scale(1.05); } }
    @keyframes bounce-nori { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    @keyframes progress { from { width: 0%; } to { width: 100%; } }
    @keyframes fade-cycle { 0%,20%,100% { opacity: 0; transform: translateY(10px); } 30%,70% { opacity: 1; transform: translateY(0); } 80%,99% { opacity: 0; transform: translateY(-10px); } }

    .spin { animation: spin-slow 3s linear infinite; }
    .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
    .bounce { animation: bounce-nori 1.5s ease-in-out infinite; }
    .progress-bar { animation: progress 3.5s ease-in-out forwards; }

    .tip { position: absolute; text-align: center; width: 100%; animation: fade-cycle 3s ease infinite; }
    .tip:nth-child(1) { animation-delay: 0s; }
    .tip:nth-child(2) { animation-delay: 3s; }
    .tip:nth-child(3) { animation-delay: 6s; }
    .tip:nth-child(4) { animation-delay: 9s; }
  </style>
  <script>
    // Auto-advance to reveal after ~4 seconds
    setTimeout(() => { window.location.href = '14-meal-reveal.html'; }, 4000);

    // Step cycling
    const steps = [
      "Analyzing your dietary needs...",
      "Calculating protein targets...",
      "Sourcing budget-friendly ingredients...",
      "Optimizing for injection day...",
      "Building your personalized plan..."
    ];
    let idx = 0;
    function cycleStep() {
      document.getElementById('stepText').textContent = steps[idx % steps.length];
      idx++;
    }
    window.onload = () => {
      cycleStep();
      setInterval(cycleStep, 800);
    };
  </script>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-[390px] min-h-screen flex flex-col items-center justify-center relative overflow-hidden" style="background:#141311">

    <!-- Ambient glows -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
      <div class="w-96 h-96 rounded-full pulse-glow" style="background:radial-gradient(circle, rgba(232,157,53,0.2) 0%, transparent 70%)"></div>
    </div>
    <div class="absolute bottom-0 right-0 w-64 h-64 rounded-full blur-3xl opacity-10 pointer-events-none" style="background:radial-gradient(circle, #8A9A7C 0%, transparent 70%)"></div>

    <!-- Spinning ring -->
    <div class="relative flex items-center justify-center mb-8">
      <svg class="spin absolute w-56 h-56" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(232,157,53,0.15)" stroke-width="2"/>
        <circle cx="50" cy="50" r="45" fill="none" stroke="var(--primary)" stroke-width="3"
          stroke-dasharray="70 212" stroke-linecap="round" transform="rotate(-90 50 50)"/>
      </svg>
      <!-- Nori bouncing -->
      <div class="bounce relative z-10">
        <img src="references/NoriCharacter.png" alt="Nori" class="w-28 h-28 object-contain" />
      </div>
    </div>

    <!-- Text -->
    <h1 class="text-2xl font-extrabold mb-2 text-center" style="color:var(--foreground)">Nori is cooking up<br/>your plan...</h1>
    <p id="stepText" class="text-sm mb-8 text-center" style="color:var(--muted-foreground)">Analyzing your dietary needs...</p>

    <!-- Progress bar -->
    <div class="w-64 h-2 rounded-full overflow-hidden mb-4" style="background:var(--muted)">
      <div class="h-full rounded-full progress-bar" style="background:var(--primary)"></div>
    </div>

    <!-- Fact card -->
    <div class="mx-6 p-4 rounded-2xl w-full max-w-xs" style="background:var(--card); border:1px solid var(--border)">
      <p class="text-xs font-bold mb-1" style="color:var(--primary)">💡 Did you know?</p>
      <p class="text-xs leading-relaxed" style="color:var(--muted-foreground)">GLP-1 users need 1.2–1.6g of protein per kg of body weight to prevent muscle loss during weight reduction.</p>
    </div>

  </div>
</body>
</html>
