<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="references/NoriIcon.png" />
  <title>FoodWise – Let's Build Your Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <style type="text/tailwindcss">
    :root {
      --background: #141311; --foreground: #F4EFE6;
      --primary: #E89D35; --primary-foreground: #141311;
      --secondary: #8A9A7C; --muted: #2A2824; --muted-foreground: #9B968C;
      --accent: #D87F63; --card: #1E1D1A; --border: #2E2C28;
    }
    body { background: var(--background); color: var(--foreground); font-family: 'Plus Jakarta Sans', sans-serif; }
    .btn-primary { background: var(--primary); color: var(--primary-foreground); border-radius: 9999px; font-weight: 700; padding: 18px 32px; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; font-size: 16px; }
    @keyframes bounce-nori { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .bounce { animation: bounce-nori 2s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-[390px] min-h-screen flex flex-col relative overflow-hidden" style="background:#141311">

    <!-- Golden burst glow -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-80 h-80 rounded-full blur-3xl opacity-20 pointer-events-none" style="background:radial-gradient(circle, #E89D35 0%, transparent 70%)"></div>

    <!-- Nav -->
    <div class="flex items-center justify-between px-6 pt-14 mb-4">
      <a href="08-mirror2.html" class="w-10 h-10 rounded-full flex items-center justify-center" style="background:var(--muted)">
        <iconify-icon icon="solar:arrow-left-bold" style="color:var(--foreground)"></iconify-icon>
      </a>
      <div></div>
    </div>

    <!-- Nori excited -->
    <div class="flex flex-col items-center px-6 text-center flex-1 justify-center">
      <div class="bounce mb-6">
        <img src="references/NoriCharacter.png" alt="Nori" class="w-40 h-40 object-contain drop-shadow-2xl" />
      </div>

      <p class="text-sm font-bold uppercase tracking-widest mb-3" style="color:var(--primary)">Time to try it</p>
      <h1 class="text-3xl font-extrabold leading-tight mb-4">
        Let's build your<br/><span style="color:var(--primary)">first meal plan</span><br/>together!
      </h1>
      <p class="text-base leading-relaxed mb-8" style="color:var(--muted-foreground)">
        I'll ask you 3 quick questions, then show you a real personalized plan. Takes about 60 seconds.
      </p>

      <!-- 3 steps -->
      <div class="w-full flex items-center justify-center gap-0 mb-8">
        <div class="flex flex-col items-center gap-2">
          <div class="w-12 h-12 rounded-full flex items-center justify-center font-extrabold text-lg" style="background:var(--primary); color:var(--primary-foreground)">1</div>
          <p class="text-xs font-semibold" style="color:var(--foreground)">Diet needs</p>
        </div>
        <div class="flex-1 h-0.5 mx-2" style="background:var(--border)"></div>
        <div class="flex flex-col items-center gap-2">
          <div class="w-12 h-12 rounded-full flex items-center justify-center font-extrabold text-lg" style="background:var(--muted); color:var(--muted-foreground)">2</div>
          <p class="text-xs font-semibold" style="color:var(--muted-foreground)">Budget</p>
        </div>
        <div class="flex-1 h-0.5 mx-2" style="background:var(--border)"></div>
        <div class="flex flex-col items-center gap-2">
          <div class="w-12 h-12 rounded-full flex items-center justify-center font-extrabold text-lg" style="background:var(--muted); color:var(--muted-foreground)">3</div>
          <p class="text-xs font-semibold" style="color:var(--muted-foreground)">Appetite</p>
        </div>
      </div>
    </div>

    <!-- Bottom -->
    <div class="px-6 pb-12 flex flex-col gap-3">
      <a href="10-restrictions.html" class="btn-primary">
        Let's go!
        <iconify-icon icon="solar:arrow-right-bold"></iconify-icon>
      </a>
      <p class="text-xs text-center" style="color:var(--muted-foreground)">You can always update your preferences later</p>
    </div>

  </div>
</body>
</html>
